[project]
name = "doot-bot"
version = "0.1.0"
description = "A bot that loops the Doot music in voice channels"
readme = "README.md"
authors = [
    { name = "1nder", email = "20195347+1nderr@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
doot-bot = "doot_bot:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
